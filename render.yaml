# Render altyapı tanımı — API ve veritabanı.
#
# Kullanım: bu depoyu Render'a bağlayın, "Blueprint" olarak bu dosyayı seçin.
# Veritabanı ve API birlikte oluşturulur; bağlantı dizesi otomatik bağlanır.
#
# Arayüz burada değil, GitHub Pages'te yayınlanır:
#   cd frontend && VITE_API_BASE_URL=https://... ./scripts/deploy-pages.sh

databases:
  - name: gameflow-db
    databaseName: gameflow
    user: gameflow
    plan: free

services:
  # --------------------------------------------------------------------- API
  - type: web
    name: gameflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health

    # Yüklenen dosyalar (görev ekleri, sohbet dosyaları) kalıcı diskte tutulur;
    # aksi halde her dağıtımda silinirler.
    disk:
      name: gameflow-uploads
      mountPath: /app/uploads
      sizeGB: 1

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Render, PostgreSQL bağlantısını postgres:// URI biçiminde verir;
      # ConnectionStringResolver bu biçimi Npgsql formatına çevirir.
      - key: DATABASE_URL
        fromDatabase:
          name: gameflow-db
          property: connectionString

      # JWT imzalama anahtarı Render tarafından üretilir ve panelde saklanır.
      - key: Jwt__Secret
        generateValue: true

      # İlk yönetici hesabı. Şifre panelden elle girilir; depoda tutulmaz.
      # Sistemde kayıt ekranı yoktur: diğer bütün hesaplar bu hesapla girilip
      # Yönetim paneli → Kullanıcılar ekranından açılır.
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false

      # Arayüzün yayın **kaynağı** (origin): şema dahil, yol ve sondaki / olmadan.
      # Örn. https://kayra-dev.github.io  —  .../GameFlow/ yazılırsa eşleşme
      # tutmaz ve tarayıcı bütün istekleri CORS nedeniyle engeller.
      - key: Cors__AllowedOrigins__0
        sync: false
