# Render altyapı tanımı — yalnızca API.
#
# Kullanım: bu depoyu Render'a bağlayın, "Blueprint" olarak bu dosyayı seçin.
#
# Veritabanı burada tanımlı değil: Render'ın ücretsiz PostgreSQL örneği sürelidir
# ve dolduğunda silinir. Veritabanı Neon'da (veya süresiz ücretsiz başka bir
# sağlayıcıda) açılır ve bağlantı dizesi DATABASE_URL olarak elle girilir.
#
# Arayüz de burada değil, GitHub Pages'te yayınlanır:
#   cd frontend && VITE_API_BASE_URL=https://... ./scripts/deploy-pages.sh

services:
  - type: web
    name: gameflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health

    # Kalıcı disk tanımlanmadı: Render'da diskler ücretli planlara özeldir ve
    # ücretsiz planla birlikte bildirilirse blueprint reddedilir.
    #
    # Sonucu: görev ekleri ve sohbet dosyaları konteyner yeniden başlayana kadar
    # yaşar, sonra kaybolur. Ücretsiz planda servis uykuya geçip uyandığında da
    # yeniden başlar. Dosya eklerinin kalıcı olması gerekiyorsa ya ücretli plana
    # geçilip buraya bir disk eklenmeli ya da dosyalar veritabanında/nesne
    # deposunda tutulmalıdır.

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Kalıcı disk olmadığı için ekler veritabanında saklanır; diske yazılsalardı
      # servis her uyanışında/yeniden dağıtımda kaybolurlardı.
      - key: FileStorage__Provider
        value: Database

      # Dosyalar veritabanı satırı olarak tutulduğundan sınır düşük tutulur.
      - key: FileStorage__MaxFileSizeBytes
        value: '10485760' # 10 MB

      # Neon'un verdiği postgres:// bağlantı dizesi. ConnectionStringResolver
      # bu biçimi Npgsql formatına çevirir ve SSL'i zorunlu kılar.
      - key: DATABASE_URL
        sync: false

      # JWT imzalama anahtarı Render tarafından üretilir ve panelde saklanır.
      - key: Jwt__Secret
        generateValue: true

      # İlk yönetici hesabı. Sistemde kayıt ekranı yoktur: diğer bütün hesaplar
      # bu hesapla girilip Yönetim paneli → Kullanıcılar ekranından açılır.
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false

      # Arayüzün yayın **kaynağı** (origin): şema dahil, yol ve sondaki / olmadan.
      # Örn. https://kayra-dev.github.io  —  .../GameFlow/ yazılırsa eşleşme
      # tutmaz ve tarayıcı bütün istekleri CORS nedeniyle engeller.
      - key: Cors__AllowedOrigins__0
        sync: false
